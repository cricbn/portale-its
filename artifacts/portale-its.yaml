AWSTemplateFormatVersion: '2010-09-09'

# =============================================================================
# DESCRIZIONE SECONDARIA, ALLINEATA. Non e la fonte di verita.
#
# Il binario principale e main.tf (Terraform), come da azione 3.1 della perizia.
# Questo template descrive le STESSE risorse, con gli stessi nomi e gli stessi
# controlli di sicurezza, ed e usato dal collaudo su finto-AWS. Se i due file
# divergono, vale main.tf e questo va riallineato.
#
# Risolve IAC-01: prima esistevano due definizioni con impostazioni di
# sicurezza opposte (public access block attivo qui, disattivato nel Terraform).
# =============================================================================

Description: >-
  Portale ITS - bucket del sito (privato, versionato, cifrato), bucket dei log
  e tabella iscrizioni. Allineato a main.tf.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, test, prod]
    Default: test
    Description: Ambiente di destinazione.
  Owner:
    Type: String
    Default: squadra-0
    MinLength: 3
    Description: Referente responsabile. Obbligatorio, imposta il tag Owner.

Resources:

  # --- bucket dei log di accesso -------------------------------------------
  LogBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: e il bucket di destinazione dei log; loggare i log su se stessi crea ricorsione
    Properties:
      BucketName: !Sub 'portale-its-log-${Env}-${Owner}'
      # I log di accesso non si conservano per sempre.
      LifecycleConfiguration:
        Rules:
          - Id: scadenza-log
            Status: Enabled
            ExpirationInDays: 365
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

  LogBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LogBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ConsentiScritturaLogS3
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${LogBucket.Arn}/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: NegaTrasportoInChiaro
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt LogBucket.Arn
              - !Sub '${LogBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # --- bucket del sito ------------------------------------------------------
  # Resta privato: nessun Allow con Principal "*" (cfr. SEC-02/SEC-03).
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'portale-its-sito-${Env}-${Owner}'
      # Tracciabilita degli accessi (cfr. OPS-04).
      LoggingConfiguration:
        DestinationBucketName: !Ref LogBucket
        LogFilePrefix: sito/
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # Versionamento: prerequisito del rollback (cfr. OPS-02).
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: scadenza-versioni-precedenti
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

  # Policy NON pubblica: nega soltanto, nessun Allow anonimo.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: NegaTrasportoInChiaro
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # --- tabella iscrizioni ---------------------------------------------------
  IscrizioniTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_119
            comment: cifratura con chiave gestita AWS; la classificazione del dato (perizia 4.1) e prerequisito per decidere una CMK
    Properties:
      TableName: !Sub 'portale-its-iscrizioni-${Env}-${Owner}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: iscrizioneId
          AttributeType: S
      KeySchema:
        - AttributeName: iscrizioneId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Owner
          Value: !Ref Owner
        - Key: Env
          Value: !Ref Env
        - Key: Progetto
          Value: portale-its

# Output usati dal collaudo per verificare che le risorse esistano davvero.
# Non si espone WebsiteURL: il bucket e privato e il website endpoint S3 e
# solo HTTP (cfr. SEC-05). La pubblicazione avviene via CloudFront/HTTPS.
Outputs:
  BucketSito:
    Description: Nome del bucket che ospita il sito.
    Value: !Ref SiteBucket
  BucketLog:
    Description: Nome del bucket dei log di accesso.
    Value: !Ref LogBucket
  TabellaIscrizioni:
    Description: Nome della tabella DynamoDB delle iscrizioni.
    Value: !Ref IscrizioniTable
  Ambiente:
    Description: Ambiente applicato.
    Value: !Ref Env
  Referente:
    Description: Referente responsabile.
    Value: !Ref Owner
